name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - name: Install pnpm and setup Node.js
        uses: ./.github/actions/pnpm-node
      - name: Install dependencies
        run: pnpm clean-install
      - name: Build the package
        run: pnpm build
      - name: Release
        if: github.event_name == 'push'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          ISSUE_PR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./packages/cli/bin/index.js --debug
      - name: Publish missing package
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --filter @release-change/ci publish --access public --no-git-checks --provenance
